[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentops-sdk"
dynamic = ["version"]
description = "Enterprise AgentOps SDK for GCP telemetry, safety, memory, SQL governance, and evaluation."
readme = "sdk/README.md"
requires-python = ">=3.11,<3.15"
authors = [
    { name = "Google Professional Services" }
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "typing-extensions>=4.12.0",
    "protobuf>=4.25.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "opentelemetry-exporter-gcp-trace>=1.6.0",
    "opentelemetry-exporter-gcp-monitoring>=1.6.0a0",
    "google-auth>=2.29.0",
    "google-api-core>=2.19.0",
    "google-cloud-logging>=3.10.0",
    "google-cloud-storage>=2.16.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-dlp>=3.16.0",
    "google-cloud-modelarmor>=0.2.0",
    "google-cloud-bigquery>=3.20.0",
    "google-cloud-aiplatform>=1.111.0,<2.0.0",
    "google-genai>=1.0.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.5",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.4",
    "sqlglot>=23.0.0",
    "packaging>=24.0",
]

[project.optional-dependencies]
cloudsql = [
    "sqlalchemy>=2.0.29",
    "psycopg2-binary>=2.9.9",
]
eval = [
    "google-cloud-aiplatform[evaluation]>=1.111.0,<2.0.0",
    "pandas>=2.1.0",
]
ragas = [
    "ragas>=0.1.9",
    "datasets>=2.19.0",
]
feature-store = [
    "google-cloud-aiplatform>=1.111.0,<2.0.0",
]
mcp = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]
all = [
    "sqlalchemy>=2.0.29",
    "psycopg2-binary>=2.9.9",
    "google-cloud-aiplatform[evaluation]>=1.111.0,<2.0.0",
    "pandas>=2.1.0",
    "ragas>=0.1.9",
    "datasets>=2.19.0",
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "python-dotenv>=1.0.1",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
]

[project.entry-points.pytest11]
agentops_eval = "agentops_sdk.pytest_plugin"

[tool.setuptools.dynamic]
version = {attr = "agentops_sdk.__version__"}

[tool.setuptools.packages.find]
where = ["sdk/src"]

[tool.setuptools.package-data]
agentops_sdk = ["py.typed"]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "BLE", "C90", "SIM", "RUF", "PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["agentops_sdk"]
force-single-line = true
single-line-exclusions = ["typing", "collections.abc", "typing_extensions"]
force-sort-within-sections = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E402", "E501"]
"examples/**" = ["S101", "S310", "S603", "S608", "E402", "E501"]
"tools/**" = ["S603", "S607", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_subclassing_any = false

[tool.pytest.ini_options]
pythonpath = [".", "sdk/src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "quality_gate: Marks test as an AgentOps evaluation quality gate",
    "vertex_eval: Marks test as requiring Vertex AI Evaluation Service",
    "trajectory_eval: Marks test as multi-turn trajectory quality evaluation",
]
filterwarnings = [
    "ignore::DeprecationWarning:google.*",
    "ignore::DeprecationWarning:vertexai.*",
]

[tool.coverage.run]
source = ["sdk/src/agentops_sdk"]
disable_warnings = ["module-not-measured"]
