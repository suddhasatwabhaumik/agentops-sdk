services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: agentops-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      - GCP_PROJECT_ID=${GOOGLE_CLOUD_PROJECT:-${GCP_PROJECT:?Set GOOGLE_CLOUD_PROJECT or GCP_PROJECT in environment}}
      - GOOGLE_APPLICATION_CREDENTIALS=/etc/gcp/sa-key.json
    ports:
      - "4317:4317"   # OTLP gRPC (matches OTEL_COLLECTOR_URL=http://localhost:4317)
      - "4318:4318"   # OTLP HTTP
      - "13133:13133" # Health check extension
      - "8889:8889"   # Prometheus scraper port
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - ${KEY_FILE:-$HOME/.config/gcloud/application_default_credentials.json}:/etc/gcp/sa-key.json:ro # ensure to login with gcloud auth application-default login
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: agentops-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:latest
    container_name: agentops-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in environment}
    depends_on:
      - prometheus
