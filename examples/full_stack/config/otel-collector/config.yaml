#
# Ingest path "otel-collector": the AgentOps SDK exports OTLP here (localhost:14317).
#   metrics -> re-exposed on :8889 and scraped by Prometheus (pull model)
#   traces  -> Tempo (OTLP gRPC)
#   logs    -> Loki native OTLP endpoint
#
# Component names follow collector-contrib 0.161: the OTLP exporters are `otlp_grpc` and
# `otlp_http` (the older `otlp` / `otlphttp` names are gone).

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  # Datapoint, log-record and span attribute. On metrics it becomes a Prometheus label.
  attributes/ingest_path:
    actions:
      - key: ingest_path
        value: otel-collector
        action: insert
  batch: {}

exporters:
  # service.namespace/service.name -> job, service.instance.id -> instance.
  # Prometheus scrapes this with honor_labels so those labels survive.
  prometheus:
    endpoint: 0.0.0.0:8889
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/ingest_path, batch]
      exporters: [otlp_grpc/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/ingest_path, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/ingest_path, batch]
      exporters: [otlp_http/loki, debug]
