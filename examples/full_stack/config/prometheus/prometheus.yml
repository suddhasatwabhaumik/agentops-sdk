#
# Two ways SDK metrics reach this Prometheus:
#   - pushed by Alloy and by the Tempo metrics-generator (remote write, --web.enable-remote-write-receiver)
#   - scraped from the OTel Collector's prometheus exporter (job otel-collector-sdk-metrics)
# The remaining jobs scrape the self-telemetry of every stack component for the pipeline-health dashboard.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # Keep the job/instance labels the exporter derives from the SDK resource
  # (service.namespace/service.name and service.instance.id) instead of the scrape target's.
  - job_name: otel-collector-sdk-metrics
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
