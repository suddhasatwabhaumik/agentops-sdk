#
# Loki 3.7 single binary, filesystem storage.
# Based on grafana/loki v3.7.8 cmd/loki/loki-local-config.yaml.
#
# OTLP arrives at /otlp. Resource attributes such as service.name, service.namespace and
# service.instance.id become index labels (service_name, ...); log attributes become structured
# metadata (trace_id, span_id, llm_input_tokens, ...), which LogQL filters and unwraps directly.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  metric_aggregation_enabled: true

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Feeds Grafana Logs Drilldown.
pattern_ingester:
  enabled: true
  metric_aggregation:
    loki_address: localhost:3100

frontend:
  encoding: protobuf

analytics:
  reporting_enabled: false
