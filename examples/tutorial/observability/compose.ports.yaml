# Port overrides for the full_stack compose file, used by stack.sh.
# On a developer machine 3000 and 8888 are often taken (Grafana elsewhere, other tools).
services:
  grafana:
    ports: !override
      - "127.0.0.1:3002:3000"
  otel-collector:
    ports: !override
      - "127.0.0.1:14317:4317"
      - "127.0.0.1:14318:4318"
      - "127.0.0.1:18888:8888"
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:13133:13133"
